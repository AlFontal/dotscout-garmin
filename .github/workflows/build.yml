name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Pull requests from forks get no secrets, so they can't download the SDK; skip them.
      - name: Check for SDK credentials
        id: creds
        run: echo "ok=${{ secrets.GARMIN_USERNAME != '' }}" >> "$GITHUB_OUTPUT"
      - name: Install the Connect IQ SDK and devices
        if: steps.creds.outputs.ok == 'true'
        run: .github/actions-setup.sh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          CIQ_AGREEMENT_HASH: ${{ vars.CIQ_AGREEMENT_HASH }}
      # A throwaway key: this build only checks that every device compiles.
      - name: Build for every device
        if: steps.creds.outputs.ok == 'true'
        run: |
          openssl genrsa -out /tmp/key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          monkeyc -e -r -f monkey.jungle -o /tmp/Dotscout.iq -y /tmp/key.der -w
